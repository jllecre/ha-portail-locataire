name: Portail locataire
description: Portail HTTPS avec connexion et expiration du séjour
version: "0.2.0"
slug: portail_locataire

arch:
  - aarch64
  - amd64

startup: application
boot: manual
init: false

ingress: true
ingress_port: 8099
panel_icon: mdi:home-account
panel_title: Portail test

homeassistant_api: true

map:
  - ssl:ro

ports:
  8443/tcp: 8443

ports_description:
  8443/tcp: Portail HTTPS avec authentification locataire

options:
  portal_url: ""
  guest_code: ""
  expires_at: ""

schema:
  portal_url: str
  guest_code: password
  expires_at: str
