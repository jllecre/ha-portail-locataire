name: Portail locataire
description: Portail HTTPS sécurisé avec puissance et énergie en lecture seule
version: "0.6.5"
slug: portail_locataire

arch:
  - aarch64
  - amd64

startup: application
boot: manual
init: false

ingress: true
ingress_port: 8099
panel_icon: mdi:home-account
panel_title: Portail test

homeassistant_api: true

map:
  - ssl:ro

ports:
  8443/tcp: 8443

ports_description:
  8443/tcp: Portail HTTPS avec authentification locataire

options:
  portal_url: ""
  guest_code: ""
  expires_at: ""
  consumption_entity: sensor.conso_hinojo45_consototale
  energy_attribute: total_consumption

  temperature_entity: sensor.termostatoz1_local_temperature
  door_code: ""
  contact_phone: ""
  guest_name: ""
  outdoor_temperature_entity: sensor.hinojo_45_temperature_exterieure

  zone1_entity: climate.termostatoz1
  zone2_entity: climate.termostatoz2
  zone3_entity: climate.termostatoz3
  zone4_entity: climate.termostatoz4

schema:
  portal_url: str
  guest_code: password
  expires_at: str
  consumption_entity: str
  energy_attribute: str
  temperature_entity: str
  door_code: password
  contact_phone: str
  guest_name: str
  outdoor_temperature_entity: str
  zone1_entity: str
  zone2_entity: str
  zone3_entity: str
  zone4_entity: str
